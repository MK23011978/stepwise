# Cloud Build pipeline: test → build image → migrate (Cloud Run job) → deploy to Cloud Run.
# Trigger on pushes to main. Substitutions: _REGION, _SERVICE, _REPO, _SQL_INSTANCE (project:region:instance)
substitutions:
  _REGION: europe-west2
  _SERVICE: stepwise-web
  _REPO: stepwise
  _SQL_INSTANCE: ${PROJECT_ID}:europe-west2:stepwise-pg
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: test
    name: node:20
    entrypoint: bash
    args: ['-c', 'npm ci --no-audit --no-fund && npm test']
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}']
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy stepwise-migrate --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA} \
          --set-cloudsql-instances ${_SQL_INSTANCE} --set-secrets DATABASE_URL=database-url:latest \
          --command node --args=--import,tsx,scripts/migrate.ts --max-retries 0
        gcloud run jobs execute stepwise-migrate --region ${_REGION} --wait
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,STRIPE_SECRET_KEY=stripe-secret:latest,STRIPE_PUBLISHABLE_KEY=stripe-publishable:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook:latest
      - --set-env-vars=NODE_ENV=production,COOKIE_SECURE=true
      - --min-instances=1
      - --max-instances=10
      - --concurrency=80
      - --cpu=1
      - --memory=1Gi
      - --allow-unauthenticated
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}
