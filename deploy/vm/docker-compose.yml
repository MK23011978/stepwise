# Stepwise on a single small VM: PostgreSQL 16 + app + Caddy (automatic HTTPS).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: stepwise, POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: stepwise }
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./backups:/backups"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U stepwise"], interval: 5s, retries: 30 }
    mem_limit: 300m
  app:
    image: stepwise:latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: "postgres://stepwise:${DB_PASSWORD}@db:5432/stepwise"
      JWT_SECRET: "${JWT_SECRET}"
      NODE_ENV: production
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: "https://${DOMAIN}"
      RUN_MIGRATIONS: "true"
      DB_POOL_MAX: "5"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    mem_limit: 520m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8080
    volumes: ["caddy_data:/data"]
    mem_limit: 80m
volumes: { pgdata: {}, caddy_data: {} }
